name: all_in_one
description: All in One - free image and PDF toolkit
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  image: ^4.2.0
  pdf: ^3.11.1
  pdfrx: ^1.0.0
  archive: any
  syncfusion_flutter_pdf: any
  google_mlkit_text_recognition: any
  google_mlkit_selfie_segmentation: any
  google_fonts: any
  qr_flutter: any
flutter:
  uses-material-design: true
